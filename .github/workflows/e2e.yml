name: E2E Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run check
      - name: Start static app
        run: |
          python3 -m http.server 4173 > /tmp/soutu-http.log 2>&1 &
          echo $! > /tmp/soutu-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/soutu-http.log
          exit 1
      - name: Browser regression
        run: npx playwright test tests/e2e.spec.mjs tests/full-regression.spec.mjs tests/price-intelligence.spec.mjs tests/price-reliability.spec.mjs tests/price-history.spec.mjs tests/competitor-intelligence.spec.mjs --reporter=line
      - name: Production smoke regression
        env:
          SOUTU_PRO_URL: https://soutu-pro.vercel.app
          SOUTU_EXPECTED_COMMIT: ${{ github.sha }}
        run: node tests/production-smoke.mjs
      - name: Production UI brand regression
        env:
          SOUTU_PRO_URL: https://soutu-pro.vercel.app
        run: npx playwright test tests/production-ui.spec.mjs --reporter=line
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            playwright-report/
          if-no-files-found: ignore