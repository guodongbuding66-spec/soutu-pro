name: E2E Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run check
      - name: Start static app
        run: |
          python3 -m http.server 4173 > /tmp/soutu-http.log 2>&1 &
          echo $! > /tmp/soutu-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/soutu-http.log
          exit 1
      - name: Browser regression
        run: npx playwright test tests/e2e.spec.mjs tests/full-regression.spec.mjs tests/price-intelligence.spec.mjs --reporter=line
      - name: Check production release state
        id: production
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const base = 'https://soutu-pro.vercel.app';
          (async () => {
            let current = false;
            try {
              const stamp = Date.now();
              const [page,config,module] = await Promise.all([
                fetch(base + '/?qa=' + stamp, { headers: { 'cache-control': 'no-cache' } }),
                fetch(base + '/config.js?qa=' + stamp, { headers: { 'cache-control': 'no-cache' } }),
                fetch(base + '/price-intelligence.js?qa=' + stamp, { headers: { 'cache-control': 'no-cache' } })
              ]);
              const html = await page.text();
              const configText = await config.text();
              const moduleText = await module.text();
              current = page.ok && html.includes('?v=' + version) && config.ok && configText.includes('price-intelligence.js') && module.ok && moduleText.includes('SOUTU_PRICE_INTELLIGENCE');
            } catch {}
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'current=' + current + '\n');
            if (!current) console.log('::warning::Production does not yet contain the repository frontend + runtime price-intelligence loader + module; production verification is deferred, not passed.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Production smoke regression
        if: steps.production.outputs.current == 'true'
        env:
          SOUTU_PRO_URL: https://soutu-pro.vercel.app
        run: node tests/production-smoke.mjs
      - name: Production UI brand regression
        if: steps.production.outputs.current == 'true'
        env:
          SOUTU_PRO_URL: https://soutu-pro.vercel.app
        run: npx playwright test tests/production-ui.spec.mjs --reporter=line
      - name: Report deferred production verification
        if: steps.production.outputs.current != 'true'
        run: echo "Production verification deferred because soutu-pro.vercel.app is missing the current frontend, runtime loader, or modular price intelligence asset."
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.sha }}
          path: |
            test-results/**/*.png
            playwright-report/
          if-no-files-found: ignore
