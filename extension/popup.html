</style><div class="head"><h1>搜图 Pro 采集器</h1><span class="badge">V2</span></div><p>把搜索结果、商品参数和网页图片带回统一研究工作台。</p><div class="actions"><button class="action" id="collect"><span class="ico">⌕</span><span><b>采集当前搜索结果</b><small>Google Lens / Bing / Yandex / 普通搜索页</small></span></button><button class="action" id="images"><span class="ico">▧</span><span><b>抓取页面大图</b><small>批量提取当前网页中的商品图和原图链接</small></span></button><button class="action" id="product"><span class="ico">□</span><span><b>提取商品参数</b><small>读取 JSON-LD 的品牌、SKU、GTIN、价格等</small></span></button><button class="action" id="evidence"><span class="ico">✓</span><span><b>保存证据快照</b><small>下载当前可见页面截图 + 元数据 JSON</small></span></button></div><div class="settings"><label>搜图 Pro 地址<input id="url"></label><div class="row"><button id="save">保存地址</button><button id="open">打开工作台</button></div><div class="status" id="status"></div></div><script src="collector.js"></script><script src="popup.js"></script></html>
